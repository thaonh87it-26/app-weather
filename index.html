<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lịch - Nhật ký</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f86c9">
<meta property="og:type" content="website">
<meta property="og:title" content="Lịch - Nhật ký">
<meta property="og:description" content="Xem thời tiết, lịch âm và quản lý lịch cá nhân. Bấm vào liên kết để mở ứng dụng và lưu lịch được chia sẻ.">
<meta property="og:image" content="icon-512.png">
<script>(function(){function h(m){try{var b=document.getElementById("tpLoi");if(!b){b=document.createElement("div");b.id="tpLoi";b.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#c62f3a;color:#fff;font:12px/1.4 sans-serif;padding:6px 10px;max-height:30vh;overflow:auto;white-space:pre-wrap";b.onclick=function(){b.remove()};(document.body||document.documentElement).appendChild(b)}if(b.textContent.length<800)b.textContent+=m+"\n"}catch(_){}}
window.addEventListener("error",function(e){h("Lỗi: "+e.message+" ("+(e.lineno||"?")+")")});window.addEventListener("unhandledrejection",function(e){h("Lỗi: "+(e.reason&&e.reason.message||e.reason))})})();</script>
<script>try{var f=parseFloat(localStorage.getItem("tpFs"));if(f>=.8&&f<=1.5)document.documentElement.style.setProperty("--fs",f)}catch(e){}</script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ===== CSS: phần "lớp sơn" - màu sắc và bố cục ===== */
:root{--fs:1;--chu:#12303f;--chinh:#0f5f8c;--nang:#e08a00;--kinh:rgba(255,255,255,.84)}
*{box-sizing:border-box}
body{margin:0;color:var(--chu);font-family:system-ui,"Segoe UI",Roboto,sans-serif;font-size:calc(16px * var(--fs,1));line-height:1.3}
.bg{position:fixed;inset:0;z-index:-1}
.bg svg{width:100%;height:100%;display:block}
/* Hình nền theo thời tiết nơi đang chọn: ngày nắng / ngày mưa / đêm (html[data-nen], html[data-mua]) */
.bg .nen-nang,.bg .nen-mua,.bg .nen-dem,.bg .lop-mua{opacity:0}
html:not([data-nen]) .bg .nen-nang,html[data-nen="nang"] .bg .nen-nang,html[data-nen="mua"] .bg .nen-mua,html[data-nen="dem"] .bg .nen-dem,html[data-mua="1"] .bg .lop-mua{opacity:1}
html[data-nen="mua"] .wx{background:linear-gradient(180deg,#4f6475 0%,#8195a3 62%,#c3ced6 100%)}
html[data-nen="dem"] .wx{background:linear-gradient(180deg,#070f26 0%,#1b2f5e 62%,#3f5688 100%)}
main{max-width:720px;margin:0 auto;padding:8px 8px 16px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
h1{margin:2px 4px 6px;font-size:calc(18px * var(--fs,1));line-height:1.25;color:#fff;text-shadow:0 1px 5px #0007}
#amlich{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-shadow:inherit;text-align:left;cursor:pointer}
#amlich span{display:inline-block}
#amlich:focus-visible{outline:2px solid var(--nang);outline-offset:2px;border-radius:4px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.phai{max-width:46%;text-align:right}
.ban{font-size:calc(12px * var(--fs,1));line-height:1.35;color:#fff;text-shadow:0 1px 3px #0008;text-align:center;padding:14px 8px 6px;margin-top:auto}
.co{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
.co button{padding:0;border:2px solid transparent;border-radius:5px;background:none;line-height:0;cursor:pointer;opacity:.65}
.co button.on{border-color:#fff;opacity:1}
.co svg{width:26px;height:17px;display:block;border-radius:2px}
.tabs{display:flex;gap:5px;margin:0 0 6px;overflow-x:auto;padding-bottom:2px}
.tabs button{padding:4px 10px;border:0;border-radius:999px;background:rgba(255,255,255,.6);color:var(--chu);font:inherit;font-size:calc(14px * var(--fs,1));font-weight:600;white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--chu);color:#fff}
/* Kéo thả đổi thứ tự thành phố */
.tabs button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tabs button[data-sv]{cursor:grab;transition:transform .15s}
.tabs button.keo{transition:none;position:relative;z-index:3;box-shadow:0 3px 10px #0005;cursor:grabbing}
.tabs button:focus-visible,.co button:focus-visible{outline:2px solid var(--nang);outline-offset:1px}
.tabs button span{margin-left:5px;opacity:.7}
.tabs .them{background:transparent;border:1px dashed #fff;color:#fff;text-shadow:0 1px 3px #0007}
.box{background:var(--kinh);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:12px;padding:8px 10px;margin-bottom:6px;box-shadow:0 2px 8px #0002}
.box h2{margin:0 0 4px;font-size:calc(14px * var(--fs,1));font-weight:600;opacity:.75}
.js-msg,.js-tip{color:#fff;text-shadow:0 1px 3px #0008;padding:2px 4px;font-size:calc(14px * var(--fs,1))}
.js-msg:empty,.js-tip:empty{display:none}
.now{display:flex;align-items:center;gap:10px}
.now .icon{font-size:calc(30px * var(--fs,1));line-height:1}
.now .temp{font-size:calc(26px * var(--fs,1));font-weight:700;line-height:1}
.now{gap:8px}
.mt{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:calc(12px * var(--fs,1));margin:2px 0 4px}
.mt b{font-weight:700}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:4px}
.chip{background:#fff9;border-radius:8px;padding:2px 3px;font-size:calc(12px * var(--fs,1));text-align:center}
.chip b{display:block;font-size:calc(14px * var(--fs,1))}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.day{flex:0 0 calc(100px * var(--fs,1));background:#fffb;border-radius:10px;padding:5px 4px;text-align:center;display:flex;flex-direction:column;gap:1px;font-size:calc(12px * var(--fs,1));cursor:pointer;border:2px solid transparent}
.day.sel{background:#fff;border-color:#f2b705}
.day .ic{font-size:calc(24px * var(--fs,1));line-height:1.1}
.day .t{font-size:calc(16px * var(--fs,1));font-weight:700}
.cao{color:#c77d00}.thap{color:var(--chinh)}
.aqi{border-radius:6px;color:#fff;font-weight:700;font-size:calc(12px * var(--fs,1));padding:0 4px}
.note{font-size:calc(12px * var(--fs,1));opacity:.7;margin:3px 0 0}
svg.chart{width:100%;height:auto;max-height:190px;color:var(--chu);display:block}
.legend{font-size:calc(12px * var(--fs,1));margin-top:2px}
.tim input{width:100%;padding:8px 10px;font:inherit;border:1px solid var(--chinh);border-radius:8px}
.tim ul{list-style:none;margin:6px 0 0;padding:0}
.tim li{padding:8px 6px;border-bottom:1px solid #0001;cursor:pointer}
.tim li.trong{opacity:.6;cursor:default}
.tim .dong{position:relative;z-index:2;float:right;background:none;border:0;font:inherit;font-size:calc(14px * var(--fs,1));cursor:pointer;color:var(--chinh)}
.kieu{display:flex;gap:14px;margin-bottom:2px;overflow-x:auto}
.kieu button{background:none;border:0;border-bottom:2px solid transparent;font:inherit;font-size:calc(14px * var(--fs,1));padding:2px 0;cursor:pointer;color:var(--chu);white-space:nowrap}
.kieu button.on{border-color:#f2b705;font-weight:700}
[hidden]{display:none!important}
.diachi{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:3px 10px;color:#fff;text-shadow:0 1px 3px #0008;font-size:calc(14px * var(--fs,1));padding:0 4px 6px}
.js-dc{flex:1 1 auto;min-width:0}
.gio{font-size:calc(14px * var(--fs,1));margin:0 0 6px}
.lich-bg{position:fixed;inset:0;background:rgba(10,30,45,.55);display:flex;align-items:center;justify-content:center;padding:10px;z-index:50}
.lich{width:100%;max-width:420px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px #0006}
.lich-h{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#0f5f8c;color:#fff}
.lich-h b{font-size:calc(20px * var(--fs,1))}
.lich-h button{background:rgba(255,255,255,.22);border:0;color:#fff;font-size:calc(22px * var(--fs,1));line-height:1;width:36px;height:36px;border-radius:50%;cursor:pointer}
.lich-w,.lich-g{display:grid;grid-template-columns:repeat(7,1fr)}
.lich-w div{text-align:center;padding:5px 0;font-weight:700;font-size:calc(14px * var(--fs,1));background:#e9f2f6}
.lich-g div{position:relative;height:54px;border:1px solid #e3ebf0;padding:3px 5px}
.lich-g .s{font-size:calc(19px * var(--fs,1));font-weight:700}
.lich-g .a{position:absolute;right:5px;bottom:2px;font-size:calc(12px * var(--fs,1));color:#0b2f66}
.lich-g .kh{opacity:.35}
.t7{color:#8a2b2b}.cn{color:#d32f2f}
.lich-g .nay{background:#5bc8cf}
.lich-f{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;font-size:calc(12px * var(--fs,1));color:#5f7380}
.lich-f button{border:0;border-radius:999px;padding:5px 12px;font:inherit;font-size:calc(14px * var(--fs,1));font-weight:600;cursor:pointer;background:#dcebf4;color:#12303f;white-space:nowrap}
.lich-f .bt{display:flex;gap:6px;flex:none}
.lich-f button.dg{background:#fde8ea;color:#c62f3a}
/* Màn hình chính: các khối cách đều nhau */
main>#up{margin-bottom:14px}
main>.tabs{margin-bottom:10px}
main>.diachi{padding-bottom:8px}
#nowMain .box,#gioMain .box{margin-bottom:14px}
/* Hộp lịch: tiêu đề và nút cuối luôn nhìn thấy, danh sách dài cuộn bên trong */
.lich-bg{padding:10px;overflow:hidden}
.lich{display:flex;flex-direction:column;max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px);overflow-y:auto}
.lich>*{flex:none}
.lich>.gcp{flex:1 1 auto;min-height:110px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.lich>.gcp .gcp-h{position:sticky;top:0;z-index:2;background:#fff;padding-bottom:4px;margin-bottom:2px}
.lkb{background:#eef6fb;border-radius:10px;padding:8px;margin:6px 0}
.lkb .note{margin:0 0 6px;opacity:.85}
.lich{max-height:calc(100vh - 20px);overflow-y:auto}
.lich-g div{height:calc(46px * var(--fs,1));cursor:pointer}
.lich-g .gc{background:#ffe3a1}
.lich-g .nay.gc{background:#5bc8cf;box-shadow:inset 0 0 0 3px #f2b705}
.lich-g .chon{outline:2px solid #0f5f8c;outline-offset:-2px}
.gcp{padding:8px 12px;border-top:1px solid #e3ebf0;font-size:calc(14px * var(--fs,1))}
.gcp-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 8px;margin-bottom:6px}
.gc-it{display:flex;gap:8px;padding:7px 8px;border-radius:8px;background:#f3f8fb;margin-bottom:5px;cursor:pointer}
.gc-it .g{flex:none;min-width:58px;font-weight:700;color:#0f5f8c}
.gc-it small{display:block;color:#5f7380;font-size:calc(12px * var(--fs,1))}
.gc-big{white-space:pre-wrap;word-break:break-word;font-size:calc(16px * var(--fs,1));margin:2px 0 6px}
.btn{border:0;border-radius:999px;padding:6px 13px;font:inherit;font-size:calc(14px * var(--fs,1));font-weight:600;cursor:pointer;background:#dcebf4;color:#12303f;white-space:nowrap}
.btn.p{background:#0f5f8c;color:#fff}.btn.d{background:#c62f3a;color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fm label{display:block;font-size:calc(12px * var(--fs,1));font-weight:600;margin:8px 0 3px;color:#5f7380}
.fm input,.fm textarea,.fm select{width:100%;padding:8px;border:1px solid #b8c7d0;border-radius:8px;font:inherit;font-size:calc(14px * var(--fs,1));color:#12303f;background:#fff}
.fm .row{display:flex;gap:8px}.fm .row>div{flex:1;min-width:0}
.fm .rd{display:flex;gap:16px}
.fm .rd label,.fm .ck{display:flex;align-items:center;gap:6px;font-size:calc(14px * var(--fs,1));font-weight:500;color:#12303f;margin:4px 0}
.fm .rd input,.fm .ck input{width:auto}
.fm small{font-size:calc(12px * var(--fs,1));color:#5f7380}
.err{color:#c62f3a;font-size:calc(12px * var(--fs,1));margin-top:6px}
#up{padding:6px 10px}
.up-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px;font-size:calc(14px * var(--fs,1));font-weight:700}
.seg{display:flex;gap:5px;margin:4px 0}
.seg button{border:0;border-radius:999px;padding:3px 11px;font:inherit;font-size:calc(12px * var(--fs,1));font-weight:600;background:rgba(15,95,140,.12);color:var(--chu);cursor:pointer}
.seg button.on{background:var(--chu);color:#fff}
.up-list{position:relative;max-height:min(32vh,210px);overflow-y:auto;overscroll-behavior:contain}
.up-it{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:calc(14px * var(--fs,1));border-top:1px solid #0001;cursor:pointer}
.up-it .u{flex:none;min-width:70px;color:#0f5f8c;font-weight:700}
.up-it .gi{flex:none;min-width:38px;font-weight:600}
.up-it .nd{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up-it.qua{opacity:.5}
.xd{flex:none;border:0;border-radius:8px;background:#fde8ea;color:#c62f3a;width:32px;height:32px;font-size:calc(16px * var(--fs,1));line-height:1;cursor:pointer;align-self:center}
.up-it .xd{width:26px;height:26px;font-size:calc(14px * var(--fs,1))}
.mh{font-size:calc(12px * var(--fs,1));font-weight:700;color:#5f7380;margin:9px 0 4px;cursor:pointer}
.mh.hn{color:#0f5f8c}
.bt2{display:flex;gap:6px}
.gc-it .g.dl{min-width:74px}
.gc-m{flex:1;min-width:0;word-break:break-word}
#xnPop{z-index:60}
#alPop{z-index:90}
.al-it{display:flex;gap:10px;align-items:baseline;margin:6px 0;font-size:calc(16px * var(--fs,1));word-break:break-word}
.al-it b{font-size:calc(22px * var(--fs,1));color:#c62f3a}
.xn-box{padding:16px;max-width:340px}
.xn-t{font-size:calc(16px * var(--fs,1));font-weight:700;margin-bottom:6px}
.xn-n{font-size:calc(14px * var(--fs,1));margin-bottom:6px;word-break:break-word}

/* ===== Bổ sung: menu, cửa sổ phụ, mã QR, giọng nói ===== */
.co .mn{border:0;border-radius:6px;background:rgba(255,255,255,.28);color:#fff;font-size:calc(18px * var(--fs,1));line-height:1;width:32px;height:26px;opacity:1;text-shadow:0 1px 3px #0007}
#appPop{z-index:70}
.ap{width:100%;max-width:400px;background:#fff;border-radius:16px;box-shadow:0 8px 30px #0006;max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px);overflow-y:auto;padding:14px 16px}
.ap h3{margin:0 0 8px;font-size:calc(17px * var(--fs,1))}
.ap p,.ap li{font-size:calc(14px * var(--fs,1));margin:4px 0}
.ap ul{padding-left:18px;margin:4px 0 8px}
.mi{display:block;width:100%;text-align:left;border:0;background:#f3f8fb;border-radius:10px;padding:11px 12px;margin-bottom:6px;font:inherit;font-size:calc(16px * var(--fs,1));font-weight:600;color:var(--chu);cursor:pointer}
.qr-c{display:block;margin:6px auto;max-width:100%;height:auto;border:1px solid #e3ebf0;border-radius:8px}
.vid{background:#000;border-radius:10px;overflow:hidden;aspect-ratio:4/3}
.vid video{width:100%;height:100%;object-fit:cover;display:block}
.ok{color:#2e7d32;font-size:calc(12px * var(--fs,1));margin-top:6px}
#apSt.ok,#vcSt.ok{font-size:calc(14px * var(--fs,1))}
#apSt,#vcSt{margin-top:6px;font-size:calc(14px * var(--fs,1))}
.vc{background:#eef6fb;border-radius:10px;padding:8px;margin:6px 0}
.vc small{color:#5f7380;font-size:calc(12px * var(--fs,1));margin-left:4px}

/* ===== Bổ sung v2: nút biểu tượng, màn hình thời tiết, chia sẻ Zalo/Messenger ===== */
.up-h>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up-act{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex:none}
.ib{width:34px;height:30px;padding:0;border:0;border-radius:999px;background:#cfe3ef;color:#0b2f45;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font:inherit}
.ib svg{width:18px;height:18px;display:block}
.ib:focus-visible{outline:2px solid var(--nang);outline-offset:1px}
.h3i svg{width:20px;height:20px;vertical-align:-3px}
.btn.zl{background:#0068ff;color:#fff}
.btn.ms{background:linear-gradient(135deg,#0099ff,#a033ff);color:#fff}
#nowMain{cursor:pointer}
.wx{position:fixed;inset:0;z-index:65;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(180deg,#2f86c9 0%,#8fcbf0 62%,#e3f4ff 100%)}
.wx-in{max-width:720px;margin:0 auto;padding:8px 8px 24px}
.wx-h{display:flex;align-items:center;gap:10px;margin:2px 4px 8px;color:#fff;text-shadow:0 1px 5px #0007;font-size:calc(18px * var(--fs,1))}
.wx-h .ib{width:38px;height:34px;font-size:calc(26px * var(--fs,1));line-height:1;background:rgba(255,255,255,.3);color:#fff;text-shadow:none}
/* Popup bám đúng vùng nhìn thấy (visualViewport): không bị thanh công cụ của cửa sổ tạm Zalo/Messenger che mất đầu và cuối */
.lich-bg,.wx{inset:auto;left:var(--vvl,0px);top:var(--vvt,0px);width:var(--vvw,100%);height:var(--vvh,100%)}
.lich{max-height:min(100%, calc(100dvh - 20px))}
.ap{max-height:min(100%, calc(100dvh - 20px))}
/* Nhật ký */
.ic{margin-right:3px}
.gc-it.nk{background:#eaf7f0;border-left:3px solid #2e9d6b}
.up-it.nk .nd{color:#1c6b49}
.tag-nk{display:inline-block;background:#2e9d6b;color:#fff;border-radius:999px;font-size:calc(12px * var(--fs,1));padding:1px 8px;margin-right:6px;vertical-align:middle}
.lich-g .nk{background:#cdeedb}
.lich-g .gc.nk{background:#ffe3a1;box-shadow:inset 0 -4px 0 #2e9d6b}
.lich-g .nay.nk{background:#5bc8cf;box-shadow:inset 0 0 0 3px #2e9d6b}
.lich-g .nay.gc.nk{background:#5bc8cf;box-shadow:inset 0 0 0 3px #f2b705, inset 0 -5px 0 #2e9d6b}
.loai{display:flex;gap:6px;margin:2px 0 8px}
.loai button{flex:1;padding:8px;border:1px solid #b8c7d0;border-radius:10px;background:#fff;color:#12303f;font:inherit;font-size:calc(14px * var(--fs,1));cursor:pointer}
.loai button.on{background:#0f5f8c;color:#fff;border-color:#0f5f8c;font-weight:700}
/* Lọc từ ngày đến ngày (màn Tất cả lịch & nhật ký) */
.rg{display:flex;gap:6px;align-items:flex-end;margin:0 0 8px}
.rg label{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:calc(12px * var(--fs,1));color:#5f7380}
.rg input{width:100%;min-width:0;box-sizing:border-box;padding:6px 8px;border:1px solid #b8c7d0;border-radius:10px;font:inherit;font-size:calc(14px * var(--fs,1));color:#12303f;background:#fff}
.rg button{flex:none;border:0;border-radius:999px;padding:8px 12px;font:inherit;font-size:calc(14px * var(--fs,1));font-weight:600;cursor:pointer;background:#dcebf4;color:#12303f;white-space:nowrap}

/* ===== v1.0.1.20: popup chi tiết/form có nút cố định, danh sách nhóm theo ngày, cài đặt ===== */
#ctPop{z-index:55}
.ct{width:100%;max-width:420px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px #0006;display:flex;flex-direction:column;max-height:100%}
.ct-h{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 14px;background:#0f5f8c;color:#fff}
.ct-h.nk{background:#2e9d6b}
.ct-h b{font-size:calc(16px * var(--fs,1));min-width:0}
.ct-h button{flex:none;background:rgba(255,255,255,.22);border:0;color:#fff;font-size:calc(18px * var(--fs,1));line-height:1;width:34px;height:34px;border-radius:50%;cursor:pointer}

		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
		for (var v = 0; v < 15; v++) {
			mod = (!test && ( (bits >> v) & 1) === 1);
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
		for (var h = 0; h < 15; h++) {
			mod = (!test && ( (bits >> h) & 1) === 1);
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
		this.modules[this.moduleCount - 8][8] = (!test);

		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
			if (col === 6) col--;
			while (true) {
				for (var c = 0; c < 2; c++) {
					if (this.modules[row][col - c] === null) {
						var dark = false;
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);

						var mask = QRUtil.getMask(maskPattern, row, col - c);

						}

							byteIndex++;

						}
					}

		var data = dataList[i];

		totalDataCount += rsBlocks[x].dataCount;
	}
	if (buffer.getLengthInBits() > totalDataCount * 8) {

            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

		buffer.put(0, 4);
	}
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}
	while (true) {
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

QRCode.createBytes = function(buffer, rsBlocks) {
	var offset = 0;
	var maxDcCount = 0;
	var maxEcCount = 0;
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	for (var r = 0; r < rsBlocks.length; r++) {
		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;
		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		dcdata[r] = new Array(dcCount);
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);

		for (var x = 0; x < ecdata[r].length; x++) {

			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}
	}
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}
	var data = new Array(totalCodeCount);
	var index = 0;
	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}

// ===== Đổi dương lịch sang âm lịch Việt Nam (múi giờ UTC+7) =====
// Thuật toán thiên văn của Hồ Ngọc Đức: tính ngày trăng mới và vị trí Mặt Trời.
const INT = d => Math.floor(d);
function jdFromDate(dd, mm, yy){
  const a = INT((14-mm)/12), y = yy+4800-a, m = mm+12*a-3;
  let jd = dd + INT((153*m+2)/5) + 365*y + INT(y/4) - INT(y/100) + INT(y/400) - 32045;
  if(jd < 2299161) jd = dd + INT((153*m+2)/5) + 365*y + INT(y/4) - 32083;
  return jd;
}
function newMoon(k){
  const T=k/1236.85, T2=T*T, T3=T2*T, dr=Math.PI/180;
  let Jd1 = 2415020.75933 + 29.53058868*k + 0.0001178*T2 - 0.000000155*T3;
  Jd1 += 0.00033*Math.sin((166.56 + 132.87*T - 0.009173*T2)*dr);
  const M = 359.2242 + 29.10535608*k - 0.0000333*T2 - 0.00000347*T3;
  const Mpr = 306.0253 + 385.81691806*k + 0.0107306*T2 + 0.00001236*T3;
  const F = 21.2964 + 390.67050646*k - 0.0016528*T2 - 0.00000239*T3;
  let C1 = (0.1734 - 0.000393*T)*Math.sin(M*dr) + 0.0021*Math.sin(2*dr*M);
  C1 -= 0.4068*Math.sin(Mpr*dr); C1 += 0.0161*Math.sin(dr*2*Mpr); C1 -= 0.0004*Math.sin(dr*3*Mpr);
  C1 += 0.0104*Math.sin(dr*2*F); C1 -= 0.0051*Math.sin(dr*(M+Mpr));
  C1 -= 0.0074*Math.sin(dr*(M-Mpr)); C1 += 0.0004*Math.sin(dr*(2*F+M));
  C1 -= 0.0004*Math.sin(dr*(2*F-M)); C1 -= 0.0006*Math.sin(dr*(2*F+Mpr));
  C1 += 0.0010*Math.sin(dr*(2*F-Mpr)); C1 += 0.0005*Math.sin(dr*(2*Mpr+M));
  const dt = T < -11 ? 0.001 + 0.000839*T + 0.0002261*T2 - 0.00000845*T3 - 0.000000081*T*T3
                     : -0.000278 + 0.000265*T + 0.000262*T2;
  return Jd1 + C1 - dt;
}
function sunLongitude(jdn){
  const T=(jdn-2451545.0)/36525, T2=T*T, dr=Math.PI/180;
  const M = 357.52910 + 35999.05030*T - 0.0001559*T2 - 0.00000048*T*T2;
  const L0 = 280.46645 + 36000.76983*T + 0.0003032*T2;
  let DL = (1.914600 - 0.004817*T - 0.000014*T2)*Math.sin(dr*M);
  DL += (0.019993 - 0.000101*T)*Math.sin(dr*2*M) + 0.000290*Math.sin(dr*3*M);
  let L = (L0 + DL)*dr; L -= Math.PI*2*INT(L/(Math.PI*2));
  return L;
}
const sunLong = (day, tz) => INT(sunLongitude(day - 0.5 - tz/24)/Math.PI*6);
const newMoonDay = (k, tz) => INT(newMoon(k) + 0.5 + tz/24);
function lunarMonth11(yy, tz){
  const off = jdFromDate(31,12,yy) - 2415021, k = INT(off/29.530588853);
  let nm = newMoonDay(k, tz);
  if(sunLong(nm, tz) >= 9) nm = newMoonDay(k-1, tz);
  return nm;
}
function leapMonthOffset(a11, tz){
  const k = INT((a11 - 2415021.076998695)/29.530588853 + 0.5);
  let last = 0, i = 1, arc = sunLong(newMoonDay(k+i, tz), tz);
  do { last = arc; i++; arc = sunLong(newMoonDay(k+i, tz), tz); } while(arc !== last && i < 14);
  return i-1;
}
// Trả về [ngày âm, tháng âm, năm âm, 1 nếu là tháng nhuận]
function amLich(dd, mm, yy, tz=7){
  const dayNumber = jdFromDate(dd,mm,yy), k = INT((dayNumber - 2415021.076998695)/29.530588853);
  let monthStart = newMoonDay(k+1, tz);
  if(monthStart > dayNumber) monthStart = newMoonDay(k, tz);
  let a11 = lunarMonth11(yy, tz), b11 = a11, lunarYear;
  if(a11 >= monthStart){ lunarYear = yy; a11 = lunarMonth11(yy-1, tz); }
  else { lunarYear = yy+1; b11 = lunarMonth11(yy+1, tz); }
  const lunarDay = dayNumber - monthStart + 1, diff = INT((monthStart - a11)/29);
  let leap = 0, lunarMonth = diff + 11;
  if(b11 - a11 > 365){
    const ld = leapMonthOffset(a11, tz);
    if(diff >= ld){ lunarMonth = diff + 10; if(diff === ld) leap = 1; }
  }
  if(lunarMonth > 12) lunarMonth -= 12;
  if(lunarMonth >= 11 && diff < 4) lunarYear -= 1;
  return [lunarDay, lunarMonth, lunarYear, leap];
}
const CAN = ["Giáp","Ất","Bính","Đinh","Mậu","Kỷ","Canh","Tân","Nhâm","Quý"];

const lichPop = document.getElementById("lichPop"), amBtn = document.getElementById("amlich");
const p2 = n => String(n).padStart(2,"0");
const LOCL = () => lang==="vi" ? "vi-VN" : "en-GB";
const homNay = () => { const d = new Date(); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); };   // YYYY-MM-DD theo giờ máy
const parseD = s => s.split("-").map(Number);                       // "2026-10-22" -> [2026,10,22]
const dstr = (y,m,d) => y+"-"+p2(m)+"-"+p2(d);
const dmy = s => { const [y,m,d] = parseD(s); return p2(d)+"/"+p2(m)+"/"+y; };
const dimon = (y,m) => new Date(Date.UTC(y,m,0)).getUTCDate();      // số ngày của tháng dương
const addDays = (s,n) => { const [y,m,d] = parseD(s), x = new Date(Date.UTC(y,m-1,d+n)); return dstr(x.getUTCFullYear(), x.getUTCMonth()+1, x.getUTCDate()); };
const thuDai = s => { const [y,m,d] = parseD(s); return new Date(Date.UTC(y,m-1,d)).toLocaleDateString(LOCL(), {weekday:"long", timeZone:"UTC"}); };
const amDS = s => { const [y,m,d] = parseD(s); return amLich(d,m,y); };
const amShort = a => a[0]+"/"+a[1]+(a[3] ? " "+t("leap") : "");
const nhanAm = (d,m,y) => { const a = amLich(d,m,y); return t("lunar")+": "+amShort(a)+" "+canChi(a[2]); };

// Ghi chú n có rơi vào ngày dương ds ("YYYY-MM-DD") không?
function khop(n, ds){
  if(n.bo && n.bo.indexOf(ds)>=0) return false;     // lần lặp này đã chuyển thành nhật ký
  if(n.bd && ds<n.bd) return false;               // trước ngày bắt đầu
  if(n.kt && ds>n.kt) return false;               // sau ngày kết thúc
  if(n.lap==="none" || ds===n.ngay) return ds===n.ngay;
  const [y,m,d] = parseD(ds), [ay,am,ad] = parseD(n.ngay);
  if(n.che==="d"){                                // lặp theo dương lịch
    if(n.lap==="week")  return Math.round((Date.UTC(y,m-1,d)-Date.UTC(ay,am-1,ad))/864e5)%7===0;
    if(n.lap==="month") return d===Math.min(ad, dimon(y,m));
    if(n.lap==="year")  return m===am && d===Math.min(ad, dimon(y,m));
    return false;
  }
  const a = amLich(d,m,y), L = n.am;              // lặp theo âm lịch
  const cuoi = amDS(addDays(ds,1))[0]===1;        // hôm nay là ngày cuối của tháng âm?
  const ok = a[0]===L[0] || (L[0]===30 && a[0]===29 && cuoi);   // ngày 30 âm: tháng thiếu thì rơi vào ngày 29
  if(n.lap==="month") return ok;
  if(n.lap==="year")  return ok && a[1]===L[1] && !a[3];
  return false;
}
const ghiChuNgay = ds => GC.filter(n=>khop(n,ds)).sort((a,b)=>(a.gio||"").localeCompare(b.gio||""));   // "cả ngày" lên trước

const icPhai = n => { const a = [];
  if(n.anh && n.anh.length) a.push('<span title="'+t("anhT")+'">📷</span>');
  if(n.lap && n.lap!=="none") a.push('<span>🔁</span>');

  return a.length ? '<span class="ti">'+a.join("")+'</span>' : ""; };
const icAnh = n => (n.anh && n.anh.length) ? ' <span title="'+t("anhT")+'">📷</span>' : "";
const bieuTuong = n => '<span class="ic" title="'+t(laNK(n) ? "nkTag" : "lichTag")+'">'+(laNK(n) ? "📓" : "🗓️")+'</span>';
function lapText(n){
  if(!n.ngay || n.lap==="none") return "";
  const [ay,am,ad] = parseD(n.ngay), A = n.che==="a";
  if(n.lap==="week") return t("nSumW").replace("{x}", thuDai(n.ngay));
  if(n.lap==="month") return t(A ? "nSumMA" : "nSumMD").replace("{d}", A ? n.am[0] : ad);
  return t(A ? "nSumYA" : "nSumYD").replace("{d}", A ? n.am[0] : ad).replace("{m}", A ? n.am[1] : am);
}

// ----- Nhãn ngày: Hôm nay / Ngày mai / T2, 23/10 -----
function ngayNgan(ds, nam){
  const [y,m,d] = parseD(ds), w = (new Date(Date.UTC(y,m-1,d)).getUTCDay()+6)%7;
  return t("wd")[w]+", "+p2(d)+"/"+p2(m)+(nam && y!==parseD(homNay())[0] ? "/"+y : "");
}
function nhanNgay(ds, nam){
  const hom = homNay();

}

function veSapToi(){
  const box = document.getElementById("up"), cu = box.querySelector(".up-list"), cuon = cu ? cu.scrollTop : 0;
  const hom = homNay(), now = new Date(), hhmm = p2(now.getHours())+":"+p2(now.getMinutes()), [hy,hm] = parseD(hom), ngMai = addDays(hom,1);
  const start = upRange==="month" ? dstr(hy,hm,1) : upRange==="yesterday" ? addDays(hom,-1) : hom;
  const soNgay = upRange==="month" ? dimon(hy,hm) : (upRange==="today" || upRange==="yesterday") ? 1 : 7;
  const ds = [];
  for(let i=0;i<soNgay;i++){ const day = addDays(start,i); ghiChuNgay(day).forEach(n=>ds.push({day, n})); }   // đã xếp theo ngày, rồi theo giờ
  const seg = [["yesterday","rY"],["today","rT"],["7","r7"],["month","rM"]].map(([k,l])=>'<button data-r="'+k+'"'+(upRange===k ? ' class="on"' : '')+'>'+t(l)+'</button>').join("");
  let h = '<div class="up-h"><span>📝 '+t("upT")+'</span><span class="up-act">'

        + '<button class="btn p up-add" data-act="add" title="'+esc(t("add"))+'" aria-label="'+esc(t("add"))+'">＋</button></span></div>'

  if(ds.length){
    let cur = "";                                   // nhóm theo ngày: mỗi ngày một tiêu đề, bên dưới là các việc của ngày đó
    ds.forEach(x=>{
      if(x.day!==cur){
        cur = x.day;
        h += '<div class="mh up-mh'+(cur===hom ? ' hn' : '')+'">'+(cur===hom ? t("today")+' · ' : cur===ngMai ? t("tomorrow")+' · ' : '')+ngayNgan(cur, true)+' · '+t("lunar")+' '+amShort(amDS(cur))+'</div>';
      }
      const nk = laNK(x.n), qua = !nk && (x.day<hom || (x.day===hom && x.n.gio && x.n.gio<hhmm));     // lịch đã qua thì làm mờ
      h += '<div class="up-it'+(nk ? ' nk' : qua ? ' qua' : '')+'" data-up="'+x.day+'|'+x.n.id+'"><span class="gi">'+(x.n.gio || "")+'</span>'
        +'<span class="nd">'+bieuTuong(x.n)+dong1(x.n)+'</span>'
        +'<span class="ti">'+(x.n.anh && x.n.anh.length ? '<span title="'+t("anhT")+'">📷</span>' : '')+(x.n.lap!=="none" ? '<span>🔁</span>' : '')+(x.n.bt ? '<span>⏰</span>' : '')+'</span>'
        +'<button class="xd" data-del="'+x.n.id+'" title="'+t("nDel")+'" aria-label="'+t("nDel")+'">🗑</button></div>';
    });
  } else h += '<div class="up-it" style="cursor:default">'+t(upRange==="today" ? "nNoneT" : upRange==="yesterday" ? "nNoneY" : upRange==="month" ? "nNoneM" : "nNone7")+'</div>';
  h += '</div>';
  box.innerHTML = h;
  const li = box.querySelector(".up-list");
  if(upAuto){                                    // đổi chế độ xem: cuộn tới lịch đầu tiên chưa qua (kèm tiêu đề ngày nếu là việc đầu tiên của ngày)
    const f = li.querySelector(".up-it:not(.qua):not(.nk)"), hd = li.querySelector(".up-mh"), hh = hd ? hd.offsetHeight : 0;
    let y = 0;
    if(f){

function veCt(reset){

    + '<div class="ct-f">'+r.foot+'</div></div>';

  else if(a==="loai"){ if(!FM) return;
    const nk = el.dataset.v==="nk"; if(nk===(FM.loai==="nk")) return;
    if(nk) sangNk(FM);
    else { FM.loai = ""; if(FM._tl) Object.assign(FM, FM._tl); }
    if(rec && vcOn){ try{ rec.abort(); }catch(e2){} vcOn = false; }
    lichErr = ""; veCt(); }
  else if(a==="toNk"){                              // chuyển lịch đang xem thành nhật ký (không chuyển ngược lại); lịch có giờ thì lấy giờ của lịch
    const n = GC.find(x=>x.id===lichId); if(!n || laNK(n)) return;
    const hom = homNay(), occ = ctDay || n.ngay, ngay = occ<=hom ? occ : hom, gio = n.gio || "";
    FM = {nd:n.nd, ngay, che:"d", coGio:!!gio, gio:gio || "08:00", lap:"none", bd:"", kt:"", loai:"nk", anh:(n.anh || []).slice(), chuyenTu:n.id, chuyenNgay:occ, chuyenLap:n.lap!=="none"};
    lichId = null; ctView = "form"; lichErr = ""; veCt(true); }
  else if(a==="edit"){ const n = GC.find(x=>x.id===lichId); if(!n) return;
    FM = {nd:n.nd, ngay:n.ngay, che:n.che, coGio:!!n.gio, gio:n.gio || "08:00", lap:n.lap, bd:n.bd || "", kt:n.kt || "", loai:n.loai || "", bt:!!n.bt, anh:(n.anh || []).slice()};
    ctView = "form"; lichErr = ""; veCt(true); }
  else if(a==="del"){ lichDel = true; veCt(); }
  else if(a==="delNo"){ lichDel = false; veCt(); }
  else if(a==="delOk"){ GC = GC.filter(x=>x.id!==lichId); luuGC(); veSapToi(); dongCt(); if(!lichPop.hidden) veLich(); }

    if(rec && vcOn){ try{ rec.abort(); }catch(e2){} vcOn = false; }

    if(lichId){ FM = null; ctView = "detail"; lichErr = ""; veCt(true); return; }                                    // hủy sửa: quay lại chi tiết

  }

function veTatCa(){                // màn hình "Tất cả lịch & nhật ký": nhóm theo từng ngày, kèm nút xóa nhanh, có lọc từ ngày đến ngày
  const hom = homNay(), items = [];
  if(rgOn){                                          // trong khoảng ngày: mở rộng cả các lần lặp lại, giống màn hình chính
    const dif = x => { const [y,m,d] = parseD(x); return Date.UTC(y,m-1,d)/864e5; };
    const soNgay = Math.min(3660, dif(rgDen)-dif(rgTu)+1);
    for(let i=0;i<soNgay;i++){ const day = addDays(rgTu,i); ghiChuNgay(day).filter(passLoc).forEach(n=>items.push({day, n})); }
  } else {                                           // bỏ lọc: toàn bộ ghi chú, mỗi ghi chú một dòng theo ngày gốc
    GC.filter(passLoc).sort((a,b)=>a.ngay.localeCompare(b.ngay) || (a.gio||"").localeCompare(b.gio||"")).forEach(n=>items.push({day:n.ngay, n}));
  }
  let body = "", cur = "";
  items.forEach(({day, n})=>{
    if(day!==cur){                                   // tiêu đề của ngày mới: để thấy trong một ngày có những việc gì
      cur = day;
      body += '<div class="mh'+(cur===hom ? ' hn' : '')+'" style="cursor:default">'+ngayNgan(cur)+' · '+t("lunar")+' '+amShort(amDS(cur))+(cur===hom ? ' · '+t("today") : '')+'</div>';
    }
    const lap = n.lap!=="none" ? ' · 🔁 '+lapText(n) : '';
    body += '<div class="gc-it'+(laNK(n) ? ' nk' : '')+'" data-a="open" data-id="'+n.id+'" data-day="'+day+'"><div class="g">'+(n.gio || t("nAllDay"))+'</div>'
      +'<div class="gc-m"><b>'+bieuTuong(n)+dong1(n)+'</b>'+(lap ? '<small>'+lap.slice(3)+'</small>' : '')+'</div>'+icPhai(n)
      +'<button class="xd" data-del="'+n.id+'" title="'+t("nDel")+'" aria-label="'+t("nDel")+'">🗑</button></div>';
  });
  if(!items.length) body = '<div class="note">'+t(rgOn ? "fEmpty" : "nAllEmpty")+'</div>';
  const rg = rgOn
    ? '<div class="rg"><label>'+t("fFrom")+'<input type="date" data-rg="tu" value="'+rgTu+'"></label><label>'+t("fTo")+'<input type="date" data-rg="den" value="'+rgDen+'"></label><button type="button" data-a="rgOff">'+t("fAllTime")+'</button></div>'
    : '<div class="rg"><button type="button" data-a="rgOn">'+t("fOn")+'</button></div>';
  return '<div class="lich" role="dialog" aria-modal="true"><div class="lich-h"><b>📋 '+t("nAllT")+' ('+items.length+')</b><button data-a="close" aria-label="'+t("close")+'">✕</button></div>'
    + '<div style="padding:8px 12px 0;background:#fff">'+locBar()+rg+'</div><div class="gcp" style="border-top:0">'+body+'</div>'
    + '<div class="lich-f"><span>'+(!rgOn && locLoai==="lich" && items.length ? '<button class="dg" data-a="delAll">🗑 '+t("dAll")+'</button>' : '')+'</span><span class="bt"><button data-a="add">'+t("nAdd")+'</button><button data-a="close">'+t("close")+'</button></span></div></div>';
}

function luuForm(){
  const f = FM, nk = f.loai==="nk";
  if(!f.nd.trim()){ lichErr = t("nErrC"); return false; }
  if(!f.ngay){ lichErr = t("nErrD"); return false; }
  if(!nk && f.bd && f.kt && f.kt<f.bd){ lichErr = t("nErrR"); return false; }
  if(nk){                                             // nhật ký chỉ ghi việc đã xảy ra: không quá ngày (và giờ) hiện tại
    const hom = homNay(), now = new Date(), hhmm = p2(now.getHours())+":"+p2(now.getMinutes());
    if(f.ngay>hom || (f.ngay===hom && f.coGio && f.gio && f.gio>hhmm)){ lichErr = t("nkErrFut"); return false; }
  }
  const cu = lichId ? GC.find(x=>x.id===lichId) : null;
  const n = {id: lichId || "n"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), nd:f.nd.trim(), ngay:f.ngay, che:nk ? "d" : f.che,
             gio:(f.coGio && f.gio) ? f.gio : "", lap:nk ? "none" : ((f.che==="a" && f.lap==="week") ? "none" : f.lap), bd:nk ? "" : f.bd, kt:nk ? "" : f.kt, am:amDS(f.ngay)};
  if(f.anh && f.anh.length) n.anh = f.anh.slice();
  if(nk) n.loai = "nk"; else { if(cu && cu.bo && cu.bo.length) n.bo = cu.bo.slice(); if(f.bt && f.coGio && f.gio) n.bt = true; }     // sửa lịch lặp vẫn giữ các lần đã chuyển thành nhật ký
  if(trungGC(n, lichId)){ lichErr = t("dup"); return false; }      // trùng loại + ngày + giờ + nội dung
  const i = GC.findIndex(x=>x.id===n.id);
  if(i>=0) GC[i] = n; else GC.push(n);        // sửa một ghi chú = sửa mọi ngày lặp lại của nó
  if(f.chuyenTu){                             // chuyển từ lịch sang nhật ký: lịch gốc (hoặc lần lặp đó) không hiện nữa
    const src = GC.find(x=>x.id===f.chuyenTu);
    if(src){ if(src.lap==="none") GC = GC.filter(x=>x.id!==src.id); else src.bo = (src.bo || []).concat(f.chuyenNgay); }
  }
  luuGC(); lichErr = "";
  lichSel = f.ngay; const q2 = parseD(f.ngay); lichY = q2[0]; lichM = q2[1];
  return true;
}

const chuanND = s => s.trim().replace(/\s+/g," ").toLowerCase();
const khoaGC = n => (laNK(n) ? "N|" : "L|")+n.ngay+"|"+(n.gio||"")+"|"+chuanND(n.nd);                       // trùng = cùng ngày + cùng giờ + cùng nội dung
const trungGC = (n, boId) => GC.some(x=>x.id!==boId && khoaGC(x)===khoaGC(n));
const idMoi = () => "n"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

// Kiểm tra dữ liệu một lịch đọc từ QR hoặc file sao lưu; hợp lệ trả về đối tượng sạch, sai trả về null
function kiemLich(o){
  if(!o || typeof o!=="object") return null;
  const S = v => v==null ? "" : (typeof v==="string" ? v : null);
  const nd = S(o.nd), ngay = S(o.ngay), gio = S(o.gio), bd = S(o.bd), kt = S(o.kt);
  if(nd===null || ngay===null || gio===null || bd===null || kt===null) return null;
  const hopLe = s => { if(!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false; const [y,m,d] = parseD(s); return m>=1 && m<=12 && d>=1 && d<=dimon(y,m); };
  if(!nd.trim() || nd.length>1000 || !hopLe(ngay)) return null;
  if(o.che!=="d" && o.che!=="a") return null;
  if(!["none","week","month","year"].includes(o.lap)) return null;
  if(o.che==="a" && o.lap==="week") return null;
  if(gio && !/^([01]\d|2[0-3]):[0-5]\d$/.test(gio)) return null;
  if((bd && !hopLe(bd)) || (kt && !hopLe(kt)) || (bd && kt && kt<bd)) return null;
  const nk = o.loai==="nk";
  if(nk && (o.lap!=="none" || bd || kt || ngay>homNay())) return null;       // nhật ký: không lặp, không khoảng áp dụng, không ở tương lai
  const r = {nd:nd.trim(), ngay, che:o.che, gio, lap:o.lap, bd, kt};
  if(nk) r.loai = "nk";
  if(Array.isArray(o.anh)){ const a = o.anh.filter(x=>typeof x==="string" && x.length<2000 && /^(https?:\/\/\S+|local:[\w-]+)$/i.test(x)).slice(0,30); if(a.length) r.anh = a; }
  if(nk){} else if(o.bt===true && gio) r.bt = true;
  if(!nk && Array.isArray(o.bo) && o.lap!=="none"){ const bo = o.bo.filter(x=>typeof x==="string" && hopLe(x)).slice(0,400); if(bo.length) r.bo = bo; }
  return r;
}
const QR_P = "TPLICH1|";                                                            // dấu hiệu nhận biết mã lịch của app này
const goiQR = n => QR_P + JSON.stringify({nd:n.nd, ngay:n.ngay, che:n.che, gio:n.gio||"", lap:n.lap, bd:n.bd||"", kt:n.kt||""});
function docQR(s){
  if(typeof s!=="string" || s.indexOf(QR_P)!==0) return null;
  try{ return kiemLich(JSON.parse(s.slice(QR_P.length))); }catch(e){ return null; }
}

const NOTI_ON = "tpNotiOn", NOTI_MIN = "tpNotiMin", NOTI_FIRED = "tpNotiFired", NOTI_LAST = "tpNotiLast";
const notiBat = () => { try{ return localStorage.getItem(NOTI_ON)==="1"; }catch(e){ return false; } };
const notiPhut = () => { let v = 15; try{ v = parseInt(localStorage.getItem(NOTI_MIN), 10); }catch(e){} return (v>=1 && v<=1440) ? v : 15; };
const coNoti = () => typeof Notification!=="undefined";
async function xinQuyen(){
  if(!coNoti()) return "unsupported";
  if(Notification.permission==="default"){ try{ return await Notification.requestPermission(); }catch(e){ return Notification.permission; } }
  return Notification.permission;
}
const dvNhiet = () => { try{ return localStorage.getItem("tpDvNhiet")==="F" ? "F" : "C"; }catch(e){ return "C"; } };
const FS_KEY = "tpFs";
const fsGet = () => { let v = 1; try{ v = parseFloat(localStorage.getItem(FS_KEY)); }catch(e){} return (v>=.8 && v<=1.5) ? v : 1; };
function fsSet(v){
  v = Math.min(1.5, Math.max(.8, Math.round(v*100)/100));
  document.documentElement.style.setProperty("--fs", v);
  try{ localStorage.setItem(FS_KEY, String(v)); }catch(e){}
  const el = document.getElementById("fsVal"); if(el) el.textContent = Math.round(v*100)+"%";
}
function notiMsg(m, c){ const el = document.getElementById("notiSt"); if(el){ el.className = c || "note"; el.textContent = m; } }
function notiHienTrang(){                                // trạng thái hiện ngay dưới ô bật (không vẽ lại cả cửa sổ nên không bị cuộn mất)
  if(!notiBat()) return notiMsg(t("setNotiSt"), "note");
  if(!coNoti()) return notiMsg(t("setNotiNo"), "err");
  if(Notification.permission==="granted") return notiMsg(t("setNotiOk"), "ok");
  notiMsg(t(Notification.permission==="denied" ? "setNotiDeny" : "setNotiAsk"), Notification.permission==="denied" ? "err" : "note");
}
function toast(tt, body){                                // thông báo ngay trong ứng dụng khi hệ thống không cho gửi
  let el = document.getElementById("toast");
  if(!el){ el = document.createElement("div"); el.id = "toast"; el.onclick = ()=>{ el.hidden = true; }; document.body.appendChild(el); }
  el.innerHTML = "<b>"+esc(tt)+"</b><br>"+esc(body); el.hidden = false;
  clearTimeout(el._t); el._t = setTimeout(()=>{ el.hidden = true; }, 10000);
}
async function hienThongBao(tt, body, tag, giu){
  let ok = false;
  if(coNoti() && Notification.permission==="granted"){
    const opt = {body, tag, renotify:true, icon:"icon-192.png", badge:"icon-192.png", vibrate: giu ? [300,150,300,150,300] : [200,100,200], requireInteraction:!!giu};
    try{                                                  // Android/iPhone chỉ cho gửi qua service worker đã hoạt động
      const reg = navigator.serviceWorker && await Promise.race([navigator.serviceWorker.ready, new Promise(r=>setTimeout(r, 2500))]);
      if(reg && reg.showNotification){ await reg.showNotification(tt, opt); ok = true; }
    }catch(e){}
    if(!ok){ try{ new Notification(tt, opt); ok = true; }catch(e){} }
  }
  if(!ok && !giu) toast(tt, body);                        // báo thức đã có hộp thoại riêng nên không cần thêm
  return ok;
}
async function notiThu(){
  const p = await xinQuyen();
  notiHienTrang();
  if(p!=="granted"){ toast("🔔 "+t("notiTest"), t(p==="unsupported" ? "setNotiNo" : "setNotiDeny")); return; }
  const ok = await hienThongBao("🔔 "+t("notiTest"), t("notiTestB"), "thu");
  notiMsg(ok ? t("notiTestB") : t("setNotiNo"), ok ? "ok" : "err");
}
function daBao(k, ghi){                                  // nhớ những thông báo đã gửi để không gửi lặp
  let o = {}; try{ o = JSON.parse(localStorage.getItem(NOTI_FIRED) || "{}"); }catch(e){}
  if(!ghi) return !!o[k];
  const now = Date.now(); o[k] = now;
  Object.keys(o).forEach(x=>{ if(now-o[x]>3*864e5) delete o[x]; });
  try{ localStorage.setItem(NOTI_FIRED, JSON.stringify(o)); }catch(e){}
}
// Tiếng chuông: trình duyệt chỉ cho phát âm thanh sau khi người dùng đã chạm vào ứng dụng ít nhất một lần
let au = null, alTim = 0, alHet = 0, alDs = [];
function moKhoaAm(){
  try{
    if(!au){ const C = window.AudioContext || window.webkitAudioContext; if(C) au = new C(); }
    if(au && au.state==="suspended") au.resume();
  }catch(e){}
}
["pointerdown","keydown","touchstart"].forEach(ev=>document.addEventListener(ev, moKhoaAm, {passive:true}));
function keu(){
  if(!au || au.state!=="running") return;
  const b = au.currentTime;
  for(let i=0;i<3;i++){
    const o = au.createOscillator(), g = au.createGain(), s0 = b+i*0.3;
    o.type = "square"; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, s0); g.gain.exponentialRampToValueAtTime(0.25, s0+0.02); g.gain.exponentialRampToValueAtTime(0.0001, s0+0.2);
    o.connect(g); g.connect(au.destination); o.start(s0); o.stop(s0+0.22);
  }
}
function tatKeu(){ clearInterval(alTim); clearTimeout(alHet); alTim = alHet = 0; }
function batKeu(){
  tatKeu(); keu();
  alTim = setInterval(()=>{ keu(); if(navigator.vibrate){ try{ navigator.vibrate([300,150,300]); }catch(e){} } }, 1500);
  alHet = setTimeout(tatKeu, 60000);                      // tự dừng sau 1 phút
}

function baoTruoc(n, at){

function kiemBao(){
  const now = Date.now();
  let last = now - 60000;
  try{ const v = parseInt(localStorage.getItem(NOTI_LAST), 10); if(v) last = v; }catch(e){}
  last = Math.max(last, now - 15*60000);                  // mở lại sau khi bị tạm dừng: báo bù các báo thức trong 15 phút gần nhất
  try{ localStorage.setItem(NOTI_LAST, String(now)); }catch(e){}
  const bat = notiBat(), ph = notiPhut();      // không còn phụ thuộc quyền hệ thống: thiếu quyền thì báo ngay trong ứng dụng
  if(!bat && !GC.some(n=>n.bt)) return;
  const hom = homNay();
  [-1,0,1].forEach(off=>{                                 // cả hôm qua và ngày mai để đúng khi qua nửa đêm
    const day = addDays(hom, off), [y,m,d] = parseD(day);
    ghiChuNgay(day).forEach(n=>{
      if(laNK(n) || !n.gio) return;
      const [hh,mm] = n.gio.split(":").map(Number), at = new Date(y,m-1,d,hh,mm).getTime();
      if(bat && at>now && at-ph*60000<=now){
        const k = "s|"+n.id+"|"+day+"|"+n.gio+"|"+ph;
        if(!daBao(k)){ daBao(k, true); baoTruoc(n, at); }
      }
      if(n.bt && at>last && at<=now){
        const k = "a|"+n.id+"|"+day+"|"+n.gio;
        if(!daBao(k)){ daBao(k, true); baoThuc(n); }
      }
    });
  });
}

// ----- Xuất lịch (.ics) để điện thoại tự nhắc/báo thức kể cả khi đã thoát app -----
function icsSuKien(n){                                        // các dòng VEVENT của một lịch
  const [y,m,d] = n.ngay.split("-").map(Number), [hh,mm] = (n.gio || "00:00").split(":").map(Number);
  const f = (dt) => dt.getFullYear()+p2(dt.getMonth()+1)+p2(dt.getDate())+"T"+p2(dt.getHours())+p2(dt.getMinutes())+"00";
  const bd = new Date(y, m-1, d, hh, mm), kt = new Date(bd.getTime()+30*60000);
  const esc2 = x => String(x).replace(/\\/g,"\\\\").replace(/\r?\n/g,"\\n").replace(/[,;]/g,"\\$&");
  const dong = n.nd.split("\n");
  const L = ["BEGIN:VEVENT","UID:"+n.id+"@lich-nhatky","DTSTAMP:"+f(new Date()),"DTSTART:"+f(bd),"DTEND:"+f(kt),"SUMMARY:"+esc2(dong[0])];
  if(dong.length>1) L.push("DESCRIPTION:"+esc2(dong.slice(1).join("\n")));
  if(n.lap && n.lap!=="none" && !n.am){                       // lịch âm không có quy tắc lặp tương ứng nên chỉ xuất 1 lần
    let r = "RRULE:FREQ="+({week:"WEEKLY", month:"MONTHLY", year:"YEARLY"}[n.lap] || "DAILY");
    if(n.lap==="month" && d<=28) r += ";BYMONTHDAY="+d;
    if(n.kt) r += ";UNTIL="+n.kt.replace(/-/g,"")+"T235959";
    L.push(r);
  }
  const al = (tr) => L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+esc2(dong[0]),"TRIGGER:"+tr,"END:VALARM");
  if(n.bt) al("PT0S");                                         // báo thức đúng giờ
  if(notiBat()) al("-PT"+notiPhut()+"M");                      // nhắc trước theo cài đặt
  L.push("END:VEVENT");
  return L;
}
function icsFile(ds, ten){
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Lich Nhat ky//VI"];
  ds.forEach(n=>icsSuKien(n).forEach(x=>L.push(x)));
  L.push("END:VCALENDAR");
  taiFile(new Blob([L.join("\r\n")+"\r\n"], {type:"text/calendar"}), ten);
}
function taiIcs(n){ icsFile([n], "lich_"+n.ngay.replace(/-/g,"")+"_"+(n.gio || "").replace(":","")+".ics"); }
function taiIcsAll(){

let shCv = null, shTen = "";
function qrCanvas(bytes, l1, l2){
  const q = new QRLib.QRCode(-1, QRLib.EC.M); q.addData(bytes); q.make();
  const n = q.getModuleCount(), cell = Math.max(4, Math.ceil(420/(n+8))), W = (n+8)*cell, H = W + (l1 ? 78 : 0);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0,0,W,H); g.fillStyle = "#000";
  for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(q.isDark(r,k)) g.fillRect((k+4)*cell, (r+4)*cell, cell, cell);
  if(l1){
    const cat = (s, w) => { while(s.length>1 && g.measureText(s).width>w) s = s.slice(0,-1); return s; };
    g.textAlign = "center"; g.fillStyle = "#12303f";
    g.font = "bold 22px system-ui,Arial,sans-serif"; g.fillText(cat(l1, W-24), W/2, W+30);
    g.font = "18px system-ui,Arial,sans-serif"; g.fillText(cat(l2, W-24), W/2, W+58);
  }
  return c;
}

const b64d = x => { x = x.replace(/-/g,"+").replace(/_/g,"/"); while(x.length%4) x += "="; const r = atob(x), b = new Uint8Array(r.length); for(let i=0;i<r.length;i++) b[i] = r.charCodeAt(i); return new TextDecoder().decode(b); };

// Trình duyệt nào có sẵn BarcodeDetector (Chrome/Android) thì dùng; không thì nạp thư viện jsQR (ưu tiên file jsQR.min.js đặt cạnh index.html)
function napJsQR(){
  if(window.jsQR) return Promise.resolve(true);
  if(jsqrP) return jsqrP;
  const nguon = ["jsQR.min.js", "https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js", "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"];
  jsqrP = (async()=>{
    for(const src of nguon){
      const ok = await new Promise(r=>{ const el = document.createElement("script"); el.src = src; el.onload = ()=>r(!!window.jsQR); el.onerror = ()=>r(false); document.head.appendChild(el); });
      if(ok) return true;
    }
    jsqrP = null; return false;
  })();
  return jsqrP;
}
async function giaiMa(src, live){
  if(bdet===undefined){ try{ bdet = ("BarcodeDetector" in window) ? new BarcodeDetector({formats:["qr_code"]}) : null; }catch(e){ bdet = null; } }
  if(bdet){ try{ const r = await bdet.detect(src); if(r.length && r[0].rawValue) return r[0].rawValue; }catch(e){} }
  if(!window.jsQR){ if(live && bdet) return null; if(!(await napJsQR())) throw new Error("lib"); }
  let cv, w, h;
  if(src instanceof HTMLCanvasElement){ cv = src; w = src.width; h = src.height; }
  else {
    const k = Math.min(1, 640/src.videoWidth); w = Math.round(src.videoWidth*k); h = Math.round(src.videoHeight*k);
    cv = qrWork || (qrWork = document.createElement("canvas")); cv.width = w; cv.height = h;
    cv.getContext("2d", {willReadFrequently:true}).drawImage(src, 0, 0, w, h);
  }
  const d = cv.getContext("2d", {willReadFrequently:true}).getImageData(0, 0, w, h);
  const r = window.jsQR(d.data, w, h, {inversionAttempts: live ? "dontInvert" : "attemptBoth"});
  return r ? r.data : null;
}

function taiAnh(file){
  return new Promise((res, rej)=>{
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = ()=>{
      const k = Math.min(1, 1600/Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(im.naturalWidth*k)); c.height = Math.max(1, Math.round(im.naturalHeight*k));
      const g = c.getContext("2d", {willReadFrequently:true}); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u); res(c);
    };
    im.onerror = ()=>{ URL.revokeObjectURL(u); rej(new Error("img")); };
    im.src = u;
  });
}

// ----- Tạo lịch bằng giọng nói (chỉ khi thêm mới) -----
// ----- Tạo lịch bằng giọng nói: tách ngày, giờ, lặp lại, nội dung từ một câu nói tiếng Việt -----
const NW = "(?:không|một|mốt|hai|ba|bốn|tư|năm|lăm|sáu|bảy|tám|chín|mười|mươi|lẻ|linh)";
const NG = NW+"(?:\\s+"+NW+")*";
const SOV = {"không":0,"một":1,"mốt":1,"hai":2,"ba":3,"bốn":4,"tư":4,"năm":5,"lăm":5,"sáu":6,"bảy":7,"tám":8,"chín":9};
function chuSo(g){                      // "hai mươi lăm" -> "25", "mười một" -> "11", "lẻ năm" -> "5"
  const w = g.toLowerCase().split(/\s+/).filter(x=>x!=="lẻ" && x!=="linh"), r = [];
  for(let i=0;i<w.length;){
    const x = w[i], n1 = SOV[w[i+1]]; let v = null, len = 1;
    if(x==="mười"){ v = 10; if(n1>0){ v += n1; len = 2; } }
    else if(SOV[x]!==undefined){ v = SOV[x]; if(w[i+1]==="mươi"){ v *= 10; len = 2; const n2 = SOV[w[i+2]]; if(n2>0){ v += n2; len = 3; } } }
    if(v===null){ i++; continue; }
    r.push(v); i += len;
  }
  return r.join(" ");
}
// Đổi chữ thành số, nhưng CHỈ trong ngữ cảnh ngày/giờ (để không đổi nhầm "ba" = bố, "năm" = year trong nội dung)
function soHoaCau(s){
  s = s.replace(new RegExp("(^|\\s)("+NG+")(\\s+(?:giờ|phút)(?=\\s|$))","gi"), (m,a,g,b)=>a+chuSo(g)+b);
  s = s.replace(new RegExp("((?:^|\\s)(?:ngày|mùng|mồng|tháng|giờ|phút)\\s+)("+NG+")(?=\\s|$)","gi"), (m,a,g)=>a+chuSo(g));
  return s;
}
const THU_IDX = {"hai":0,"ba":1,"tư":2,"năm":3,"sáu":4,"bảy":5,"2":0,"3":1,"4":2,"5":3,"6":4,"7":5};   // 0 = thứ Hai ... 6 = Chủ nhật
function gio24(h, p){
  if(p==="chiều") return h<12 ? h+12 : h;
  if(p==="tối") return h<12 ? h+12 : h;
  if(p==="trưa") return h<=4 ? h+12 : h;
  if(p==="đêm") return h===12 ? 0 : h<6 ? h : h<12 ? h+12 : h;
  return h;                              // sáng hoặc không nói buổi
}
// raw: câu đã nghe được; hom: hôm nay "YYYY-MM-DD". Trả về {nd, ngay, gio, lap} (trường nào không nhận ra thì để rỗng)
function giongNoi(raw, hom, qk){                // qk = true: nhật ký, ngày hiểu theo hướng quá khứ (hôm qua, hôm kia, thứ ... tuần trước)
  let s = " " + String(raw).normalize("NFC").replace(/[,;!?]/g," ").replace(/\.(?=\s|$)/g," ").replace(/\s+/g," ").trim() + " ";
  const kq = {nd:"", ngay:"", gio:"", lap:""}, re = p => new RegExp(p, "i");
  const cat = (m, giu) => { s = s.slice(0, m.index) + (giu || " ") + s.slice(m.index + m[0].length); };
  const [hy,,hd] = parseD(hom), PER = "(sáng|trưa|chiều|tối|đêm)";
  let m;
  s = soHoaCau(s);

  // 1) Lặp lại: hằng tuần / hằng tháng / hằng năm / mỗi thứ hai
  s = s.replace(/\s(?:và\s+)?lặp lại(?=\s)/i, " ");
  if((m = re("\\s(?:hằng|hàng|mỗi)\\s+tuần(?=\\s)").exec(s))){ kq.lap = "week"; cat(m); }
  else if((m = re("\\s(?:hằng|hàng|mỗi)\\s+tháng(?=\\s)").exec(s))){ kq.lap = "month"; cat(m); }
  else if((m = re("\\s(?:hằng|hàng|mỗi)\\s+năm(?=\\s)").exec(s))){ kq.lap = "year"; cat(m); }
  else if((m = re("\\s(?:hằng|hàng|mỗi)\\s+(?=thứ|chủ nhật)").exec(s))){ kq.lap = "week"; cat(m); }

  // 2) Giờ: "8 giờ", "8h30", "8:30", "8 giờ 30 phút", "3 giờ rưỡi" + buổi (sáng/trưa/chiều/tối/đêm)
  m = re("\\s(\\d{1,2})\\s*(?:giờ|h|:)(?=\\s|\\d)\\s*(?:(\\d{1,2})(?!\\d|\\s*(?:tháng|\\/|-))(?:\\s*phút)?(?=\\s)|(rưỡi)(?=\\s))?").exec(s);
  if(m){
    let h = +m[1], mi = m[3] ? 30 : (m[2] ? +m[2] : 0);
    if(h<=23 && mi<=59){
      let p = "", len = m[0].length;
      const pm = re("^\\s*"+PER+"(?=\\s)").exec(s.slice(m.index+len));
      if(pm){ p = pm[1].toLowerCase(); len += pm[0].length; }
      s = s.slice(0, m.index) + " " + s.slice(m.index+len);
      if(!p){ const pm2 = re("\\s"+PER+"(?=\\s)").exec(s); if(pm2){ p = pm2[1].toLowerCase(); cat(pm2); } }
      h = gio24(h, p);
      kq.gio = p2(h)+":"+p2(mi);
    }
  }

  // 3) Ngày
  m = re("\\s(?:ngày\\s+|mùng\\s+|mồng\\s+)?(\\d{1,2})\\s*(?:\\/|-|tháng)\\s*(\\d{1,2})(?:\\s*(?:\\/|-|năm)\\s*(\\d{4}|\\d{2}))?(?=\\s)").exec(s);
  if(m){                                                   // "25/10", "25 tháng 10", "ngày 25 tháng 10 năm 2026"
    const d = +m[1], mo = +m[2]; let y = m[3] ? (m[3].length===2 ? 2000+ +m[3] : +m[3]) : hy;
    if(mo>=1 && mo<=12 && d>=1 && d<=dimon(y,mo)){
      kq.ngay = dstr(y,mo,d);
      if(qk){ if(!m[3] && kq.ngay>hom && d<=dimon(y-1,mo)) kq.ngay = dstr(y-1,mo,d); }   // nhật ký: ngày chưa tới hiểu là năm trước
      else if(!m[3] && kq.ngay<hom && d<=dimon(y+1,mo)) kq.ngay = dstr(y+1,mo,d);   // ngày đã qua: hiểu là năm sau
      cat(m);
    }
  }
  if(!kq.ngay){                                            // hôm nay / ngày mai / ngày kia
    const R = [
      [re("\\s(?:ngày hôm nay|hôm nay|bữa nay)(?=\\s)"), 0, 0], [re("^\\s*(?:hôm\\s+)?nay(?=\\s)"), 0, 0], [re("\\s(?:vào|lúc)\\s+nay(?=\\s)"), 0, 0],
      [re("\\s"+PER+"\\s+nay(?=\\s)"), 0, 1],
      [re("\\sngày mai(?=\\s)"), 1, 0], [re("^\\s*mai(?=\\s)"), 1, 0], [re("\\s(?:vào|lúc)\\s+mai(?=\\s)"), 1, 0],
      [re("\\s"+PER+"\\s+mai(?=\\s)"), 1, 1],
      [re("\\s(?:ngày kia|ngày mốt)(?=\\s)"), 2, 0]
    ];
    if(qk) R.unshift(                                      // nhật ký: hôm qua / hôm kia / tối qua
      [re("\\s"+PER+"\\s+(?:hôm\\s+)?qua(?=\\s)"), -1, 1], [re("\\s(?:ngày\\s+)?(?:hôm qua|bữa qua)(?=\\s)"), -1, 0], [re("^\\s*(?:hôm\\s+)?qua(?=\\s)"), -1, 0],
      [re("\\s(?:hôm kia|hôm kìa|ngày kia)(?=\\s)"), -2, 0]
    );
    for(const [rx, off, giu] of R){
      const x = rx.exec(s);
      if(x){ kq.ngay = addDays(hom, off); cat(x, giu ? " "+x[1]+" " : " "); break; }
    }
  }
  if(!kq.ngay){                                            // thứ hai / chủ nhật (+ tuần sau)
    m = re("\\s(?:vào\\s+)?(?:thứ\\s+(hai|ba|tư|năm|sáu|bảy|[2-7])|(chủ nhật))(?=\\s)").exec(s);
    if(m){
      const wd = m[2] ? 6 : THU_IDX[m[1].toLowerCase()];
      cat(m);
      const ts = re("\\s(?:tuần sau|tuần tới)(?=\\s)").exec(s);
      if(ts) cat(ts); else { const tn = re("\\s(?:tuần này|tuần nay)(?=\\s)").exec(s); if(tn) cat(tn); }
      const [ty,tm,td] = parseD(hom), ti = (new Date(Date.UTC(ty,tm-1,td)).getUTCDay()+6)%7;
      let off = (wd - ti + 7) % 7;
      if(qk){ const tt = re("\\s(?:tuần trước|tuần rồi|tuần qua)(?=\\s)").exec(s); if(tt){ cat(tt); off = wd - ti - 7; } else off = -((ti - wd + 7) % 7); }   // nhật ký: ngày gần nhất đã qua
      else if(ts) off = (7 - ti) + wd; else if(off===0) off = 7;
      kq.ngay = addDays(hom, off);
    }
  }
  if(!kq.ngay){                                            // "ngày 25" (không nói tháng)
    m = re("\\s(?:vào\\s+)?(?:ngày|mùng|mồng)\\s+(\\d{1,2})(?=\\s)(?:\\s+(tháng sau|tháng tới|tháng này|tháng trước|tháng rồi))?").exec(s);
    if(m){
      const d = +m[1], [ty,tm,td] = parseD(hom);
      let y = ty, mo = tm;
      if(qk){ if((m[2] && /trước|rồi/i.test(m[2])) || (!m[2] && d>td)){ mo--; if(mo<1){ mo = 12; y--; } } }
      else if((m[2] && /sau|tới/i.test(m[2])) || (!m[2] && d<td)){ mo++; if(mo>12){ mo = 1; y++; } }
      if(d>=1 && d<=dimon(y,mo)){ kq.ngay = dstr(y,mo,d); cat(m); }
    }
  }

  // 4) Nội dung: phần còn lại, bỏ các từ nối thừa
  let nd = s.replace(/\s+/g," ").trim();
  const dau = /^(?:(?:hãy\s+)?(?:tạo|thêm|đặt|lên|ghi)\s+(?:cho\s+(?:tôi|mình)\s+)?(?:một\s+)?(?:lịch|nhật ký|ghi chú|lời nhắc|nhắc nhở|cuộc hẹn)(?:\s+hẹn)?|vào lúc|vào|lúc|nội dung|là)(?:\s+|$)/i;
  const cuoi = /(?:^|\s)(?:vào lúc|vào ngày|vào|lúc|nhé|nha|giúp tôi)$/i;
  for(let i=0;i<6;i++){ const a = nd.replace(dau,"").replace(cuoi,"").trim(); if(a===nd) break; nd = a; }
  nd = nd.replace(/^[\s.:\-–]+|[\s.:\-–]+$/g,"");
  kq.nd = nd ? nd.charAt(0).toLocaleUpperCase("vi") + nd.slice(1) : "";
  return kq;
}

function veGio(nc){
  const h = DL.hourly;
  const base = nc===0 ? parseInt(DL.current.time.slice(11,13),10) : nc*24;
  const cfg = {
    nhiet:{k:"temperature_2m", dv:"°", mau:"#e0a000"},
    mua:  {k:"precipitation_probability", dv:"%", mau:"#2f86c9"},
    gio:  {k:"wind_speed_10m", dv:"", mau:"#3a9d6b"}
  }[kieu];
  const v = h[cfg.k].slice(base, base+24).map(a=>a==null?0:a);
  const top = 24, bot = 106, x = i => 16 + i*388/23;
  let lo, hi;
  if(kieu==="mua"){ lo = 0; hi = 100; }
  else if(kieu==="gio"){ lo = 0; hi = Math.max(...v)+2; }
  else { lo = Math.min(...v)-2; hi = Math.max(...v)+2; }
  if(hi-lo<1) hi = lo+1;
  const y = val => top + (hi-val)/(hi-lo)*(bot-top);
  const pts = v.map((val,i)=>x(i)+","+y(val)).join(" ");
  let s = '<svg class="chart" viewBox="0 0 420 140">'
    + '<polygon points="'+x(0)+','+bot+' '+pts+' '+x(23)+','+bot+'" fill="'+cfg.mau+'" opacity=".22"/>'
    + '<polyline fill="none" stroke="'+cfg.mau+'" stroke-width="1.8" stroke-linejoin="round" points="'+pts+'"/>';
  for(let i=0;i<24;i+=3){
    s += '<circle cx="'+x(i)+'" cy="'+y(v[i])+'" r="2.5" fill="'+cfg.mau+'"/>'
      +  '<text x="'+x(i)+'" y="'+(y(v[i])-9)+'" font-size="12" font-weight="700" text-anchor="middle" fill="currentColor">'+Math.round(v[i])+cfg.dv+'</text>'
      +  '<text x="'+x(i)+'" y="132" font-size="11" text-anchor="middle" fill="currentColor" opacity=".75">'+h.time[base+i].slice(11,16)+'</text>';
  }
  return s + '</svg>';
}

// ----- Kéo thả đổi thứ tự các thành phố đã thêm: điện thoại giữ khoảng 0,4 giây rồi kéo; chuột thì kéo luôn. Vị trí hiện tại (📍) luôn đứng đầu -----
let vuaKeo = 0;
function initKeo(box){
  let b = null, items = [], rects = [], from = -1, to = -1, x0 = 0, y0 = 0, s0 = 0, px = 0, keo = false, hen = 0, raf = 0;
  function chan(e){ if(keo && e.cancelable) e.preventDefault(); }          // đang kéo: không cho trang cuộn theo
  function don(){
    keo = false; clearTimeout(hen); cancelAnimationFrame(raf);
    document.removeEventListener("pointermove", mv); document.removeEventListener("pointerup", up);
    document.removeEventListener("pointercancel", hu); document.removeEventListener("touchmove", chan);
  }
  function xoaDang(){ items.forEach(el=>{ el.style.transform = ""; el.classList.remove("keo"); }); box.classList.remove("dangKeo"); }
  function bat(){
    keo = true;
    items = [...box.querySelectorAll("button[data-sv]")];
    from = items.indexOf(b); to = from; s0 = box.scrollLeft;
    rects = items.map(el=>{ const r = el.getBoundingClientRect(); return {l:r.left, w:r.width}; });
    b.classList.add("keo"); box.classList.add("dangKeo");
    if(navigator.vibrate){ try{ navigator.vibrate(12); }catch(e){} }
    vong();
  }
  function cn(){                                                           // đặt lại vị trí các nút theo ngón tay/chuột
    if(from<0) return;
    const cen = rects.map(r=>r.l+r.w/2);
    let dx = px - x0 + (box.scrollLeft - s0);
    dx = Math.max(cen[0]-cen[from], Math.min(cen[cen.length-1]-cen[from], dx));
    const dc = cen[from] + dx;
    to = 0; cen.forEach((c,j)=>{ if(j!==from && c<dc) to++; });
    const gap = rects.length<2 ? 5 : Math.abs(from+1<rects.length ? rects[from+1].l-(rects[from].l+rects[from].w) : rects[from].l-(rects[from-1].l+rects[from-1].w));
    const sl = rects[from].w + gap;
    items.forEach((el,j)=>{
      if(j===from){ el.style.transform = "translateX("+dx+"px) scale(1.06)"; return; }
      const kk = j<from ? j : j-1, nj = kk<to ? kk : kk+1;
      el.style.transform = nj>j ? "translateX("+sl+"px)" : nj<j ? "translateX("+(-sl)+"px)" : "";
    });
  }
  function vong(){                                                         // gần mép thì tự cuộn thanh thành phố
    if(!keo) return;
    const r = box.getBoundingClientRect();
    if(px < r.left+36) box.scrollLeft -= 7; else if(px > r.right-36) box.scrollLeft += 7;
    cn(); raf = requestAnimationFrame(vong);
  }
  function mv(e){
    px = e.clientX;
    if(keo) return;
    const mx = Math.abs(e.clientX-x0), my = Math.abs(e.clientY-y0);
    if(e.pointerType==="mouse"){ if(mx>5) bat(); }
    else if(mx>8 || my>8) don();                                           // ngón tay đang vuốt cuộn: không phải kéo thả
  }
  function up(){
    const was = keo, f = from, g = to;
    don();
    if(!was) return;
    vuaKeo = Date.now(); xoaDang();
    if(g!==f){ const a = daLuu.slice(), m = a.splice(f,1)[0]; a.splice(g,0,m); daLuu = a; luu(); }
    veTabs();                                                              // vẽ lại cả hai thanh thành phố theo thứ tự mới
  }
  function hu(){ const was = keo; don(); if(was) xoaDang(); }
  box.addEventListener("pointerdown", e=>{
    if(keo || (e.pointerType==="mouse" && e.button!==0)) return;
    const el = e.target.closest("button[data-sv]"); if(!el || e.target.closest("span")) return;
    b = el; x0 = px = e.clientX; y0 = e.clientY; from = -1;
    document.addEventListener("pointermove", mv); document.addEventListener("pointerup", up);
    document.addEventListener("pointercancel", hu); document.addEventListener("touchmove", chan, {passive:false});
    if(e.pointerType!=="mouse") hen = setTimeout(bat, 400);
  });
}

    +`&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,cloud_cover,precipitation,is_day`
    +`&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset`
    +`&hourly=relative_humidity_2m,temperature_2m,precipitation_probability,wind_speed_10m&timezone=auto&forecast_days=10`+(dvNhiet()==="F" ? "&temperature_unit=fahrenheit" : "")).then(r=>r.json());
  let aqi = {}, aqiNow = null;
  try{
    const a = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${p.lat}&longitude=${p.lon}`
      +`&current=us_aqi&hourly=us_aqi&timezone=auto&forecast_days=7`).then(r=>r.json());
    aqi = trungBinhNgay(a.hourly.time, a.hourly.us_aqi);
    aqiNow = a.current ? a.current.us_aqi : null;
  }catch(e){}
  const kq = {t:Date.now(), w, aqi, aqiNow};
  if(w.current) CACHE[kc] = kq;
  return kq;
}

async function tai(p){
  chon = p; DL = null; veDongHo(); veTabs(); veDiaChi(); setMsg("loading"); out.innerHTML = ""; nowMain.innerHTML = ""; gioMain.innerHTML = "";
  try{
    const {w, aqi, aqiNow} = await layDuLieu(p);
    if(chon!==p) return;   // bạn đã chuyển sang nơi khác trong lúc chờ
    const doAm = trungBinhNgay(w.hourly.time, w.hourly.relative_humidity_2m);
    const c = w.current, d = w.daily;
    DL = w; ngayChon = 0; datNen(w);
    const [icon, chu] = moTa(c.weather_code);
    const [mucNow, mauNow] = mucAqi(aqiNow);

    // Ô 1: thông số hiện tại
    const boxNow = '<div class="box"><h2>'+esc(ten(p))+' · '+t("updated")+' '+c.time.slice(11,16)+'</h2>'
      +'<div class="gio dongho"></div>'
      +'<div class="now"><div class="icon">'+icon+'</div><div><div class="temp">'+Math.round(c.temperature_2m)+'°'+dvNhiet()+'</div>'
      +'<div>'+chu+' · '+t("feels")+' '+Math.round(c.apparent_temperature)+'°</div></div></div>'
      +'<div class="chips">'
      +'<div class="chip">'+t("hum")+'<b>'+Math.round(c.relative_humidity_2m)+'%</b></div>'
      +'<div class="chip">'+t("wind")+'<b>'+Math.round(c.wind_speed_10m)+' km/h</b></div>'
      +'<div class="chip">'+t("cloud")+'<b>'+Math.round(c.cloud_cover)+'%</b></div>'
      +'<div class="chip">'+t("precip")+'<b>'+c.precipitation+' mm</b></div>'
      +'<div class="chip" style="grid-column:span 2">'+t("air")+'<b style="color:'+mauNow+'">'+(aqiNow!=null ? aqiNow+' – ' : '')+mucNow+'</b></div>'
      +'<div class="chip" title="'+t("sunrise")+'" aria-label="'+t("sunrise")+'">🌅<b>'+gioMt(d.sunrise,0)+'</b></div>'
      +'<div class="chip" title="'+t("sunset")+'" aria-label="'+t("sunset")+'">🌇<b>'+gioMt(d.sunset,0)+'</b></div>'
      +'</div></div>';

    let html = boxNow; nowMain.innerHTML = boxNow;     // màn hình chính chỉ hiện ô này; màn hình thời tiết hiện đầy đủ

    // Ô 2: đồ thị theo giờ
    const boxGio = '<div class="box"><h2 class="gioTieuDe"></h2>'
      + '<div class="kieu"><button data-k="nhiet">'+t("tTemp")+'</button><button data-k="mua">'+t("tRain")+'</button><button data-k="gio">'+t("tWind")+'</button></div>'
      + '<div class="gioVe"></div></div>';
    html += boxGio; gioMain.innerHTML = boxGio;

    // Ô 3: các ngày xếp ngang
    html += '<div class="box"><h2>'+t("days")+'</h2><div class="days">'
      + d.time.map((tm,k)=>{
          const dt = new Date(tm+"T00:00:00");
          const [ic, ch] = moTa(d.weather_code[k]);
          const [, mau] = mucAqi(aqi[tm]);
          return '<div class="day"><div><b>'+(k===0 ? t("today") : ngay(dt,"short"))+'</b> '+dt.getDate()+'/'+(dt.getMonth()+1)+'</div>'
            +'<div class="ic">'+ic+'</div><div>'+ch+'</div>'
            +'<div class="t"><span class="cao">'+Math.round(d.temperature_2m_max[k])+'°</span> <span class="thap">'+Math.round(d.temperature_2m_min[k])+'°</span></div>'
            +'<div>💧 '+(d.precipitation_probability_max[k] ?? "–")+'%</div>'
            +'<div>💨 '+Math.round(d.wind_speed_10m_max[k])+' km/h</div>'
            +'<div>💦 '+(doAm[tm] ?? "–")+'%</div>'
            +'<div class="aqi" style="background:'+mau+'">'+(aqi[tm]!=null ? 'AQI '+aqi[tm] : t("na"))+'</div></div>';
        }).join('')
      + '</div><p class="note">'+t("note")+'</p></div>';

    // Ô 4: đồ thị tổng hợp
    html += '<div class="box"><h2>'+t("chartT")+'</h2>'+veDoThi(d)+'</div>';

    out.innerHTML = html;
    document.querySelectorAll(".kieu button").forEach(b=>b.onclick=()=>{ kieu = b.dataset.k; capNhatGio(); });
    document.querySelectorAll(".day").forEach((el,k)=>el.onclick=()=>{ ngayChon = k; capNhatGio(); });
    capNhatGio();
    veDongHo();
    setMsg("");
  }catch(e){
    if(chon===p) setMsg("loadErr");
  }
}

// Cập nhật kích thước/vị trí vùng nhìn thấy cho các popup
(function(){
  const vv = window.visualViewport; if(!vv) return; const r = document.documentElement;
  let last = "", cho = 0;                                    // chỉ cập nhật khi số đo thật sự đổi, tối đa 1 lần mỗi khung hình (tránh vòng lặp resize trên một số trình duyệt máy tính bảng)
  const dat = () => { const a = [Math.max(0, Math.round(vv.offsetTop)), Math.max(0, Math.round(vv.offsetLeft)), Math.round(vv.width), Math.round(vv.height)]; const k = a.join(","); if(k===last) return; last = k;
    r.style.setProperty("--vvt", a[0]+"px"); r.style.setProperty("--vvl", a[1]+"px"); r.style.setProperty("--vvw", a[2]+"px"); r.style.setProperty("--vvh", a[3]+"px"); };
  const lap = () => { if(cho) return; cho = requestAnimationFrame(()=>{ cho = 0; dat(); }); };
  dat(); vv.addEventListener("resize", lap); vv.addEventListener("scroll", lap);
})();
applyStatic();
hanGiong();                                  // lần mở đầu tiên: bắt đầu tính 3 tháng dùng thử chức năng giọng nói
layViTri();
nhanLink();
nhanChiaSe();
if(!introAn() && [wxPop, lichPop, ctPop, xnPop, appPop].every(e=>e.hidden)) moGioiThieu(true);   // mở ứng dụng: hiện giới thiệu (có ô tích không hiển thị lại)
window.addEventListener("hashchange", nhanLink);
// Lịch có thể vừa được lưu ở một cửa sổ khác của cùng trang: nạp lại khi quay về ứng dụng để không mất hoặc ghi đè lịch mới
function dongBoGC(){
  let m; try{ m = JSON.parse(localStorage.getItem("tpGhiChu") || "[]"); }catch(e){ return; }
  if(!Array.isArray(m) || JSON.stringify(m)===JSON.stringify(GC)) return;
  GC = m; veSapToi(); if(!lichPop.hidden) veLich(); if(ctView==="detail") veCt();
}
window.addEventListener("storage", e => { if(e.key===null || e.key==="tpGhiChu") dongBoGC(); });
document.addEventListener("visibilitychange", () => { if(!document.hidden) dongBoGC(); });
window.addEventListener("focus", dongBoGC);
window.addEventListener("pageshow", dongBoGC);

// ----- Vuốt Back: đóng cửa sổ trên cùng (menu, lịch, hộp xác nhận, màn Xem thời tiết) thay vì thoát ứng dụng -----
// Mỗi cửa sổ đang mở ứng với một mục trong lịch sử trình duyệt; chỉ ở màn hình chính, Back mới thoát ứng dụng.
const OVS = [wxPop, lichPop, ctPop, xnPop, appPop, imPop];
let ovDepth = 0, ovBusy = false;
const ovDem = () => OVS.filter(e=>!e.hidden).length;
function ovSync(){                                   // đưa số mục lịch sử khớp với số cửa sổ đang mở
  if(ovBusy) return;
  const want = ovDem();
  if(want > ovDepth){ while(ovDepth < want){ ovDepth++; history.pushState({tpov:ovDepth}, "", location.href); } }
  else if(want < ovDepth){
    const n = ovDepth - want; ovDepth = want; ovBusy = true; history.go(-n);
    setTimeout(()=>{ if(ovBusy){ ovBusy = false; ovSync(); } }, 700);
  }
}
function ovDongTren(){ if(!imPop.hidden) dongIm(); else if(!appPop.hidden) dongApp(); else if(!xnPop.hidden) dongXn(); else if(!ctPop.hidden) dongCt(); else if(!lichPop.hidden) dongLich(); else if(!wxPop.hidden) dongTT(); }
window.addEventListener("popstate", e => {
  if(ovBusy){ ovBusy = false; ovSync(); return; }      // do chính ứng dụng đóng cửa sổ bằng nút
  if(location.hash.indexOf("#lich=")===0) return;      // mở liên kết chia sẻ, không phải Back
  const L = (e.state && e.state.tpov) || 0;
  if(L < ovDepth){ ovDepth = L; let g = 20; while(ovDem() > L && g-- > 0) ovDongTren(); }
});
const ovMo = new MutationObserver(ovSync);
OVS.forEach(el=>ovMo.observe(el, {attributes:true, attributeFilter:["hidden"]}));
veDongHo();
setInterval(veDongHo, 1000);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
